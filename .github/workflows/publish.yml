name: Publish to PyPI

# Publishes on GitHub release. Uses PyPI Trusted Publishing (OIDC) —
# configure this repo + workflow under the project's "Publishing"
# settings on pypi.org; no API token secrets needed.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
