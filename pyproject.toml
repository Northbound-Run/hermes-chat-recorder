[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-chat-recorder"
version = "0.7.3"
description = "Hermes Agent plugin that records every gateway chat message — any platform — to an Obsidian-style Markdown vault, with voice transcripts and image descriptions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Northbound", email = "matthew@hall.vc" },
]
keywords = [
    "hermes",
    "hermes-agent",
    "matrix",
    "telegram",
    "discord",
    "obsidian",
    "transcript",
    "chat-archive",
    "voice-transcription",
    "image-description",
    "chatbot",
    "ai-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]

dependencies = [
    # No third-party runtime deps. STT and vision are delegated to
    # Hermes's built-in tools.transcription_tools / tools.vision_tools,
    # so the plugin runs purely on stdlib + whatever Hermes already ships.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/northbound-run/hermes-chat-recorder"
Issues = "https://github.com/northbound-run/hermes-chat-recorder/issues"
Repository = "https://github.com/northbound-run/hermes-chat-recorder"

# Hermes plugin discovery — `pip install hermes-chat-recorder` into a
# Hermes venv makes the plugin auto-loadable via the `hermes_agent.plugins`
# entry-point group declared at hermes_cli/plugins.py:ENTRY_POINTS_GROUP.
#
# The value MUST be the module path only (no `:register` suffix). Hermes's
# _load_entrypoint_module calls ep.load() then does getattr(module, "register").
# If we point at the function directly, ep.load() returns the function and
# getattr(function, "register") is None — "no register() function" warning.
[project.entry-points."hermes_agent.plugins"]
chat_recorder = "hermes_chat_recorder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_chat_recorder = ["plugin.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Pin the package base to src/ so the type checker resolves the package as
# `hermes_chat_recorder`. Without this, the repo-root __init__.py (the
# directory-install entry shim) makes mypy walk up to the hyphenated repo
# directory and reject it as an invalid package name. `mypy src` and bare
# `mypy` both work with this config.
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib mode imports each test module by path without walking __init__.py
# chains. Required because the repo now ships a root __init__.py (the
# directory-install entry shim) and the repo dir name contains a hyphen —
# prepend mode would try to import the suite as `hermes-chat-recorder.tests`
# and fail. See README "Project layout".
addopts = "--import-mode=importlib"
