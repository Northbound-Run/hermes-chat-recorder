name: chat_recorder
version: 0.1.0
description: "Record every Hermes Matrix chat message into a vault (text, voice transcripts, image descriptions). Wake gating is owned by Hermes's native settings."
author: Northbound
license: MIT
homepage: https://github.com/northbound-run/hermes-chat-recorder
kind: standalone

# Hermes plugin loader recognizes these for setup-wizard prompts and
# the `hermes gateway status` view.
optional_env:
  OPENROUTER_API_KEY:
    description: "OpenRouter API key for image description. If unset, images are recorded without an AI-generated description."
    url: "https://openrouter.ai/keys"
    is_password: true
  IMAGE_DESCRIBER_MODEL:
    description: "Override the OpenRouter model used to describe images (default: google/gemini-3-flash-preview)."
  WHISPER_MODEL_SIZE:
    description: "Override the faster-whisper model size (tiny, base, small, medium, large-v3). Default: base."
  TRANSCRIPT_TZ:
    description: "Timezone for day-boundary in the markdown vault filenames (default: America/Los_Angeles)."

# Hooks the plugin registers. The Hermes plugin loader inspects this
# list for the `hermes gateway plugins list` view.
hooks:
  - pre_gateway_dispatch
  - on_session_start
