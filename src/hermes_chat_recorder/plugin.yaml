name: chat_recorder
version: 0.4.0
description: "Record every Hermes Matrix chat message into a vault (text, voice transcripts, image descriptions). Pretty room/user names. STT and vision delegated to Hermes's built-in tools."
author: Northbound
license: MIT
homepage: https://github.com/northbound-run/hermes-chat-recorder
kind: standalone

# This plugin no longer reads any env vars of its own. STT credentials
# (Groq / OpenAI / Mistral / xAI) and vision providers are managed by
# Hermes via the top-level `stt:` and `auxiliary.vision:` config blocks.
optional_env:
  TRANSCRIPT_TZ:
    description: "Timezone for day-boundary in the markdown vault filenames (default: America/Los_Angeles)."

# Hooks the plugin registers. The Hermes plugin loader inspects this
# list for the `hermes gateway plugins list` view.
hooks:
  - pre_gateway_dispatch
